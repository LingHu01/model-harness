[project]
name = "model-harness"
version = "0.1.0"
description = "Local harness serving particular AI models, one process per loaded model, exposed via MCP."
requires-python = ">=3.11"
# Core + shim + tools. NO torch / ML libs here.
dependencies = [
    "psutil>=5.9",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "mcp>=1.2",
]

[project.scripts]
harness-core = "core.server:main"
harness-shim = "shim.shim:main"
harness-bench = "tools.bench.bench:main"
harness-scaffold = "tools.scaffold.scaffold:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "shim", "runner", "sdk", "tools"]

[tool.uv]
package = false
