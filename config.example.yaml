# Global harness settings. Paths may be absolute or relative to this file.
# Copy to config.yaml (untracked) and edit. Also create registry.yaml listing your plugins; see README.
data_root: ../harness-data          # regenerable: cache, state, run, in, out, logs
weights_root: ../harness-weights    # default root for plugin weights
uv_cache_dir: ../harness-data/uv-cache   # MUST be on the same volume as plugins/ (hardlinks)
registry: registry.yaml              # installed plugins; folder/manifest paths are relative to it
default_python: "3.12"              # plugin venv python when the plugin has no .python-version

port: 8765                          # core HTTP, bound to 127.0.0.1 only
mcp_port: 8766                      # shared MCP server (shim --http), for several agents

timers:
  idle_timeout: 30m                 # R1
  shell_expiry: 3d                  # R2
  queue_report: 30s                 # R4
  queue_stall: 2m                   # R4
  runaway: 5m                       # R5 default, per-model limits.runaway overrides
  retention: 24h                    # in/ and out/
  shutdown_grace: 30s               # stop(): max wait for running requests
  batch_window: 50ms                # idle batching model: wait this long for more requests

memory:
  need_margin: 0.10
  need_window: 20
  bootstrap_factor: 1.2
  cuda_context_gb: 0.5
  bootstrap_ram_gb: 2.0             # RAM need before the first measured run
  sampler_ms: 75                    # external VRAM sampler, active during requests only

compile:
  vram_cap: 0.70
  min_runs_7d: 20

logs:
  max_bytes: 5000000
  backups: 3
